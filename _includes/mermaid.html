<script type="module">
  // Kramdown emits ```mermaid as <pre><code class="language-mermaid">. Turn each one
  // into an interactive viewer: direction toggle (TD/LR), zoom, pan, fullscreen.
  const codes = [...document.querySelectorAll('pre > code.language-mermaid')];
  if (codes.length) {
    const mermaid = (await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')).default;

    const DIR_RE  = /^([ \t]*(?:flowchart|graph))[ \t]+(TB|TD|BT|LR|RL)\b/m;
    const INIT_RE = /^\s*%%\{[^}]*\}%%\s*$/m;   // a diagram's own theme override

    const mermaidTheme = () => {
      const t = document.documentElement.getAttribute('data-theme');
      return t === 'light' ? 'neutral' : t === 'sepia' ? 'base' : 'dark';
    };
    const themeVars = () => {
      const css = getComputedStyle(document.documentElement);
      const v = (n) => css.getPropertyValue(n).trim();
      return {
        background: v('--bg2'), primaryColor: v('--surface-hi'),
        primaryTextColor: v('--text'), primaryBorderColor: v('--muted'),
        lineColor: v('--muted'), secondaryColor: v('--surface'),
        tertiaryColor: v('--bg'), textColor: v('--text'), fontFamily: v('--sans'),
      };
    };

    // useMaxWidth:false keeps diagrams at natural size so zoom is honest.
    const noSqueeze = { useMaxWidth: false };
    const configure = () => mermaid.initialize({
      // startOnLoad is useless here: this module runs after DOMContentLoaded.
      startOnLoad: false, securityLevel: 'loose',
      theme: mermaidTheme(), themeVariables: themeVars(),
      flowchart: noSqueeze, sequence: noSqueeze, gantt: noSqueeze,
      class: noSqueeze, state: noSqueeze, er: noSqueeze, journey: noSqueeze,
    });
    configure();

    const redraws = [];

    codes.forEach((code, i) => {
      const source = code.textContent;
      const figure = document.createElement('figure');
      figure.className = 'diagram';
      figure.innerHTML = `
        <div class="diagram-bar">
          <div class="diagram-dirs" hidden>
            <button type="button" data-dir="TD" title="Top-down layout">TD</button>
            <button type="button" data-dir="LR" title="Left-right layout">LR</button>
          </div>
          <div class="diagram-zoom">
            <button type="button" data-act="out" title="Zoom out">&minus;</button>
            <output title="Current zoom">100%</output>
            <button type="button" data-act="in" title="Zoom in">+</button>
            <button type="button" data-act="fit" title="Fit to width">Fit</button>
            <button type="button" data-act="full" title="Fullscreen">Full</button>
          </div>
        </div>
        <div class="diagram-viewport"><div class="diagram-canvas"></div></div>
        <figcaption>Drag to pan. Fit resets the view.</figcaption>`;
      code.closest('pre').replaceWith(figure);

      const viewport = figure.querySelector('.diagram-viewport');
      const canvas   = figure.querySelector('.diagram-canvas');
      const out      = figure.querySelector('output');

      const hasDir = DIR_RE.test(source);
      if (hasDir) figure.querySelector('.diagram-dirs').hidden = false;
      let dir = hasDir ? source.match(DIR_RE)[2] : null;
      let scale = 1, natural = 0;

      // Resize the SVG itself rather than CSS-transforming it: a transform scales
      // visually but leaves the layout box at natural size, so the viewport keeps
      // ~1800px of empty scrollable space and the diagram looks cut off.
      const apply = () => {
        const svg = canvas.querySelector('svg');
        if (svg && natural) {
          svg.removeAttribute('width');
          svg.removeAttribute('height');
          svg.style.width = (natural * scale) + 'px';
          svg.style.height = 'auto';
        }
        out.textContent = Math.round(scale * 100) + '%';
      };
      const fit = () => {
        if (!natural) return;
        scale = Math.min(1, (viewport.clientWidth - 4) / natural);
        apply();
        viewport.scrollLeft = 0;
      };
      const syncHeight = () => {
        const h = canvas.firstElementChild?.getBoundingClientRect().height || 0;
        viewport.style.height = Math.min(Math.ceil(h) + 2, Math.round(window.innerHeight * 0.85)) + 'px';
      };

      let observer = null;
      const draw = async () => {
        // Drop the diagram's own %%{init}%% so it follows the page theme.
        let src = source.replace(INIT_RE, '');
        if (dir) src = src.replace(DIR_RE, `$1 ${dir}`);
        try {
          const { svg } = await mermaid.render(`d${i}-${dir || 'x'}-${Date.now()}`, src);
          canvas.innerHTML = svg;
          const el = canvas.querySelector('svg');
          natural = el.viewBox?.baseVal?.width || el.getBoundingClientRect().width;
          fit();
          syncHeight();
          observer?.disconnect();
          observer = new ResizeObserver(syncHeight);
          observer.observe(canvas);
        } catch (err) {
          canvas.innerHTML = `<p class="diagram-err">Diagram failed to render: ${err.message}</p>`;
        }
      };

      figure.querySelectorAll('[data-dir]').forEach((b) => b.addEventListener('click', () => {
        dir = b.dataset.dir;
        figure.querySelectorAll('[data-dir]').forEach((x) =>
          x.classList.toggle('on', x.dataset.dir === dir));
        draw();
      }));

      figure.querySelector('.diagram-zoom').addEventListener('click', (e) => {
        const act = e.target.dataset.act;
        if (!act) return;
        if (act === 'in')  { scale = Math.min(4, scale * 1.25); apply(); syncHeight(); }
        if (act === 'out') { scale = Math.max(0.1, scale / 1.25); apply(); syncHeight(); }
        if (act === 'fit') { fit(); syncHeight(); }
        if (act === 'full') {
          if (document.fullscreenElement) document.exitFullscreen();
          else figure.requestFullscreen?.().then(() => setTimeout(() => { fit(); syncHeight(); }, 120));
        }
      });

      // Drag to pan
      let down = false, sx = 0, sy = 0, sl = 0, st = 0;
      viewport.addEventListener('pointerdown', (e) => {
        down = true; sx = e.clientX; sy = e.clientY;
        sl = viewport.scrollLeft; st = viewport.scrollTop;
        viewport.setPointerCapture(e.pointerId);
        viewport.classList.add('grabbing');
      });
      viewport.addEventListener('pointermove', (e) => {
        if (!down) return;
        viewport.scrollLeft = sl - (e.clientX - sx);
        viewport.scrollTop  = st - (e.clientY - sy);
      });
      const up = () => { down = false; viewport.classList.remove('grabbing'); };
      viewport.addEventListener('pointerup', up);
      viewport.addEventListener('pointercancel', up);

      window.addEventListener('resize', () => { if (scale <= 1) fit(); });

      if (hasDir) {
        figure.querySelector(`[data-dir="${dir === 'LR' ? 'LR' : 'TD'}"]`)?.classList.add('on');
      }
      redraws.push(draw);
      draw();
    });

    // An SVG already in the DOM keeps its old palette, so redraw on theme change.
    document.addEventListener('themechange', () => {
      configure();
      redraws.forEach((fn) => fn());
    });
  }
</script>
