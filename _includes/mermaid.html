<script type="module">
  // Kramdown emits ```mermaid as <pre><code class="language-mermaid">.
  // Rewrite those into the <pre class="mermaid"> nodes mermaid expects, then render.
  const blocks = document.querySelectorAll('pre > code.language-mermaid');
  for (const code of blocks) {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = code.textContent;
    code.parentElement.replaceWith(pre);
  }
  if (blocks.length) {
    const mermaid = (await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')).default;
    // startOnLoad is useless here: this module runs after DOMContentLoaded has
    // already fired, so the render must be kicked off explicitly.
    // useMaxWidth:false keeps diagrams at their natural size instead of squeezing a
    // 3000px flowchart into the text column; the wrapper scrolls horizontally.
    const noSqueeze = { useMaxWidth: false };
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      flowchart: noSqueeze,
      sequence: noSqueeze,
      gantt: noSqueeze,
      class: noSqueeze,
      state: noSqueeze,
      er: noSqueeze,
      journey: noSqueeze,
    });
    await mermaid.run({ querySelector: 'pre.mermaid' });
  }
</script>
